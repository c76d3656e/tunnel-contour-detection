[project]
name = "tunnel-pointcloud"
version = "0.1.0"
description = "Tunnel point-cloud axis estimation, section extraction, and profile fitting"
requires-python = ">=3.11"
dependencies = [
    "laspy>=2.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "orjson>=3.10",
    "python-multipart>=0.0.12",
    "scienceplots>=2.2.2",
]

[project.scripts]
tunnel-pc = "tunnel_pc.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["tunnel_pc*"]
